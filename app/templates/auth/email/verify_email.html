<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verify your email</title>
</head>
<body>

    <h1>Welcome to Movie Tracking, {{ username|capitalize }}!</h1>

    <p>
        Thank you for registering.
    </p>

    <p>
        Please verify your email address by clicking the link below:
    </p>

    <p>
        <a href="{{ url_for('auth.verify_email', token=token, _external=True) }}">
            Verify my email
        </a>
    </p>

    <p>
        This verification link will expire after 30 minutes.
    </p>

</body>
</html>
