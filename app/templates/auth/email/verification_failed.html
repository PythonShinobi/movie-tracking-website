<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Email verification failed</title>
</head>

<body>
    <h1>Email verification failed</h1>

<p>
    We were unable to verify your email address.
</p>

<p>
    This can happen if the verification link is invalid,
    has already been used, or has expired.
</p>

<p>
    Please return to the login page and request a new
    verification email if necessary.
</p>

<p>
    <a href="{{ url_for('auth.login') }}">
        Return to login
    </a>
</p>

</body>

</html>
